[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "wormscore"
version = "0.13.1"
description = "Blind scoring of fluorescent neurons in C. elegans confocal stacks, with measurement and genetics statistics."
keywords = ["C. elegans", "worm", "neuron", "blind scoring", "fluorescence", "microscopy", "confocal", "penetrance"]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Arjun Bansal" }]
requires-python = ">=3.12"
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "pillow>=10",
  "liffile>=2026.10.14",
  "czifile>=2026.10.14",
  "oiffile>=2026.10.15",
  "tifffile>=2024.1",
  "imagecodecs>=2024.1",
  # the app's own windows on Windows (WebView2); elsewhere the app uses the browser
  "pywebview>=6.2.1; sys_platform == 'win32'",
]

[project.urls]
Homepage = "https://github.com/arjunkai/wormscore"
Documentation = "https://github.com/arjunkai/wormscore/blob/main/docs/METHODS.md"
Issues = "https://github.com/arjunkai/wormscore/issues"
Releases = "https://github.com/arjunkai/wormscore/releases"

[project.optional-dependencies]
# Nikon .nd2 files (large: brings dask and pydantic). The Windows and Mac apps include it.
nd2 = ["nd2>=0.12"]
dev = ["pytest>=8", "pyinstaller>=6.10", "nd2>=0.12"]

[project.scripts]
wormscore = "wormscore.cli:main"

[project.gui-scripts]
wormscore-launcher = "wormscore.home:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wormscore = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
