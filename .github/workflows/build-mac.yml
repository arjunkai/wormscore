name: build-mac

# Builds wormscore.app on an Apple silicon Mac for every published release and attaches
# wormscore-mac.zip to it. Run it by hand (Actions > build-mac > Run workflow) to rebuild
# the zip for an existing release tag.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and attach to (for example v0.7.0)"
        required: true

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-15
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The app code comes from the release tag; the packaging files from this workflow's
      # commit, so releases made before Mac packaging existed can still get a Mac build.
      - run: git checkout "$TAG" -- src tests pyproject.toml README.md LICENSE
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e .[dev]
      - run: python -m pytest -q
      - run: python -m PyInstaller packaging/wormscore.spec --noconfirm
      - name: Smoke test the app's command line
        run: |
          APP=dist/wormscore.app/Contents/MacOS/wormscore
          $APP --version
          $APP demo "$RUNNER_TEMP/demo"
          $APP inventory "$RUNNER_TEMP/demo"
          $APP prepare "$RUNNER_TEMP/demo"
          $APP unblind "$RUNNER_TEMP/demo" --i-have-finished-scoring --anyway
      - name: Smoke test the app itself (home screen answers)
        run: |
          APP=dist/wormscore.app/Contents/MacOS/wormscore
          $APP > "$RUNNER_TEMP/app.out" 2>&1 &
          PID=$!
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:47311/api/state > "$RUNNER_TEMP/state.json"; then break; fi
            sleep 1
          done
          kill $PID || true
          cat "$RUNNER_TEMP/app.out"
          grep -q "\"version\"" "$RUNNER_TEMP/state.json"
      - name: Zip
        run: |
          mkdir -p stage/wormscore
          cp -R dist/wormscore.app stage/wormscore/
          cp dist/wormscore/LICENSE.txt dist/wormscore/THIRD_PARTY_LICENSES.txt stage/wormscore/
          cp packaging/README-mac.txt stage/wormscore/README.txt
          ditto -c -k --keepParent stage/wormscore wormscore-mac.zip
          ls -l wormscore-mac.zip
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" wormscore-mac.zip --clobber
