name: mac-ui

# Builds wormscore.app on an Apple silicon Mac, starts it on a simulated demo project and
# drives its home and scoring pages in WebKit (Safari's engine). Fails on page errors and
# uploads the screenshots (Actions > mac-ui > the run > Artifacts), so the Mac screens can be
# checked without a Mac. It attaches nothing to a release.
on:
  push:
    paths:
      - "src/wormscore/**"
      - "packaging/**"
      - ".github/workflows/mac-ui.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mac-ui:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install -e .[dev] playwright==1.58.0
      - run: python -m playwright install webkit
      - run: python -m PyInstaller packaging/wormscore.spec --noconfirm
      - name: Demo project with a blind set
        run: |
          APP=dist/wormscore.app/Contents/MacOS/wormscore
          $APP demo "$RUNNER_TEMP/demo"
          $APP inventory "$RUNNER_TEMP/demo"
          $APP prepare "$RUNNER_TEMP/demo"
      - name: Start the app and check its pages in WebKit
        run: |
          dist/wormscore.app/Contents/MacOS/wormscore > "$RUNNER_TEMP/app.out" 2>&1 &
          PID=$!
          python packaging/mac_ui_check.py "$RUNNER_TEMP/demo" screenshots || FAILED=1
          kill $PID || true
          cat "$RUNNER_TEMP/app.out"
          exit ${FAILED:-0}
      - name: Scoring page in WebKit (browser image check, number keys, Save outlines, Browse layout)
        # these tests skip where no browser engine is installed, as in the tests workflow; here WebKit is
        run: python -m pytest -q tests/test_scoring_page.py -rs
      - name: Open the app twice, then quit it from the Dock
        run: |
          APP="$PWD/dist/wormscore.app"
          LOG="$HOME/Library/Application Support/wormscore/app.log"
          up() { curl -sf http://127.0.0.1:47311/api/state > /dev/null; }
          open "$APP"
          for i in $(seq 1 30); do up && break; sleep 1; done
          up || { cat "$LOG"; exit 1; }     # also fails if a restart did not get port 47311 back
          open "$APP"           # already running: macOS sends it "reopen", which shows the home page
          sleep 5
          grep -q "opened again: showing the home page" "$LOG"
          ( osascript -e 'tell application id "io.github.arjunkai.wormscore" to quit' ) &
          for i in $(seq 1 20); do up || break; sleep 1; done
          cat "$LOG"
          ! up
          grep -q "closing: quit from the Dock or menu" "$LOG"
          ! pgrep -f "wormscore.app/Contents/MacOS/wormscore"
      - name: HTTPS as on a Mac without Python (the build Python's certificates hidden)
        # The app's OpenSSL looks for certificates where the build Python keeps them. They are on this
        # machine and not on a user's Mac, so they are moved away while the app makes real requests.
        run: |
          APP=dist/wormscore.app/Contents/MacOS/wormscore
          CAFILE=$(python -c "import ssl; print(ssl.get_default_verify_paths().openssl_cafile)")
          CAPATH=$(python -c "import ssl; print(ssl.get_default_verify_paths().openssl_capath)")
          echo "build Python looks for certificates in: $CAFILE and $CAPATH"
          for f in "$CAFILE" "$CAPATH"; do if [ -e "$f" ]; then sudo mv "$f" "$f.hidden"; fi; done
          restore() { for f in "$CAFILE" "$CAPATH"; do if [ -e "$f.hidden" ]; then sudo mv "$f.hidden" "$f"; fi; done; }
          trap restore EXIT
          unset SSL_CERT_FILE SSL_CERT_DIR
          # the check only means something if plain Python now fails
          if python -c "import urllib.request; urllib.request.urlopen('https://api.github.com', timeout=20)" 2>/dev/null; then
            echo "::warning::Python still verifies HTTPS with its certificates hidden, so this step proves nothing"
          else
            echo "plain Python cannot verify HTTPS now, as on a Mac without it"
          fi
          # GitHub sometimes answers the shared runner "rate limit exceeded": that reply came over verified HTTPS,
          # which is what this step checks, so only a failure to connect or verify fails it
          out=$($APP update 2>&1) || true
          echo "$out"
          if echo "$out" | grep -q "Could not reach GitHub" && ! echo "$out" | grep -q "rate limit"; then exit 1; fi
          $APP demo --real "$RUNNER_TEMP/real"
          $APP inventory "$RUNNER_TEMP/real"
          $APP prepare "$RUNNER_TEMP/real"
          test "$(ls "$RUNNER_TEMP/real/blind" | wc -l)" -eq 4
      - name: Update, then Go back, with the packaged app
        # Builds the app again with a higher version number, zips it as the release does and installs it
        # over the first build through the app's own updater, then goes back; then the same with the app
        # marked unchangeable, so the swap fails and must leave every copy whole. No release is involved:
        # the updater reads the "latest release" from a local file (update.latest_url).
        # Then all of it once more with the app on another volume than the home folder (a disk image, which
        # costs nothing on the runner), as with the app on an external disk: the kept copy must then be next
        # to the app, so that no move of the exchange is a copy between volumes. If the disk image cannot be
        # made, that part is left out with a warning.
        run: |
          OTHER=""
          if hdiutil create -size 3g -type SPARSE -fs APFS -volname wormscore-other "$RUNNER_TEMP/other-volume" \
             && mkdir "$RUNNER_TEMP/other" \
             && hdiutil attach "$RUNNER_TEMP/other-volume.sparseimage" -mountpoint "$RUNNER_TEMP/other" -nobrowse; then
            OTHER="$RUNNER_TEMP/other"
          else
            echo "::warning::no second volume could be made, so the update across volumes was not checked"
          fi
          python packaging/update_check.py --first dist/wormscore.app --work "$RUNNER_TEMP/update-check" ${OTHER:+--other-volume "$OTHER"}
          if [ -n "$OTHER" ]; then hdiutil detach "$OTHER" || true; fi
      - name: What Gatekeeper says about a downloaded copy
        # A copy built here has no quarantine mark and opens without a question. A downloaded one has it.
        # This records the verdict (the app is not signed with a paid certificate, so "rejected" is
        # expected and the README tells people to use Open Anyway); it does not fail the run.
        continue-on-error: true
        run: |
          ditto -c -k --keepParent dist/wormscore.app "$RUNNER_TEMP/wormscore-mac.zip"
          mkdir "$RUNNER_TEMP/downloaded" && ditto -x -k "$RUNNER_TEMP/wormscore-mac.zip" "$RUNNER_TEMP/downloaded"
          xattr -w com.apple.quarantine "0081;$(printf %x $(date +%s));Safari;" "$RUNNER_TEMP/downloaded/wormscore.app"
          xattr -l "$RUNNER_TEMP/downloaded/wormscore.app"
          codesign -dv "$RUNNER_TEMP/downloaded/wormscore.app" 2>&1 || true
          spctl -a -vv "$RUNNER_TEMP/downloaded/wormscore.app" 2>&1 || true
          # the program inside still runs from the downloaded copy
          "$RUNNER_TEMP/downloaded/wormscore.app/Contents/MacOS/wormscore" --version
      - name: The README's Terminal line removes the download mark
        # README.md and README-mac.txt give `xattr -dr com.apple.quarantine <app>` as the alternative to
        # Open Anyway. The mark is put on every file of the copy, as a download has it; after the line
        # none may be left, and the app must start. This one must pass.
        run: |
          APP="$RUNNER_TEMP/downloaded/wormscore.app"
          xattr -rw com.apple.quarantine "0081;$(printf %x $(date +%s));Safari;" "$APP"
          test -n "$(xattr -lr "$APP" | grep com.apple.quarantine | head -1)"
          xattr -dr com.apple.quarantine "$APP"
          if xattr -lr "$APP" | grep -q com.apple.quarantine; then echo "the download mark is still there"; exit 1; fi
          "$APP/Contents/MacOS/wormscore" --version
      - name: Home and scoring pages in real Safari
        # Playwright's WebKit is Safari's engine, not Safari. Not required: safaridriver has not been able
        # to start a session on GitHub's hosted Macs, so this step may fail without failing the run.
        continue-on-error: true
        run: |
          python -m pip install selenium
          # Tried for free on the hosted Mac (1.26.9): allow remote automation in Safari's own settings
          # before enabling the driver, and open Safari once first so its first-run setup is done.
          # Each line may fail without stopping the step; the check below says whether a session started.
          defaults write com.apple.Safari AllowRemoteAutomation 1 || true
          defaults write com.apple.Safari IncludeDevelopMenu 1 || true
          sudo safaridriver --enable || true
          safaridriver --version || true
          # 1.26.28: the session timed out because Safari was left open here; safaridriver starts its own
          # Safari. A probe on macos-15 and macos-latest (24 November 2026) started a session in 7-16 s in every
          # setup once Safari was not running.
          pkill -x Safari || true
          sleep 2
          dist/wormscore.app/Contents/MacOS/wormscore > "$RUNNER_TEMP/app2.out" 2>&1 &
          PID=$!
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:47311/api/state > /dev/null && break; sleep 1; done
          sleep 3
          pkill -x Safari || true        # the app may have opened its page in Safari: the driver needs its own
          sleep 2
          python packaging/mac_safari_check.py "$RUNNER_TEMP/demo" || FAILED=1
          kill $PID || true
          exit ${FAILED:-0}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mac-ui-screenshots
          path: screenshots/
          retention-days: 14
