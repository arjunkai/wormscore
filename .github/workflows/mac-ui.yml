name: mac-ui

# Builds wormscore.app on an Apple silicon Mac, starts it on a simulated demo project and
# drives its home and scoring pages in WebKit (Safari's engine). Fails on page errors and
# uploads the screenshots (Actions > mac-ui > the run > Artifacts), so the Mac screens can be
# checked without a Mac. It attaches nothing to a release.
on:
  push:
    paths:
      - "src/wormscore/**"
      - "packaging/**"
      - ".github/workflows/mac-ui.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mac-ui:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e .[dev] playwright==1.58.0
      - run: python -m playwright install webkit
      - run: python -m PyInstaller packaging/wormscore.spec --noconfirm
      - name: Demo project with a blind set
        run: |
          APP=dist/wormscore.app/Contents/MacOS/wormscore
          $APP demo "$RUNNER_TEMP/demo"
          $APP inventory "$RUNNER_TEMP/demo"
          $APP prepare "$RUNNER_TEMP/demo"
      - name: Start the app and check its pages in WebKit
        run: |
          dist/wormscore.app/Contents/MacOS/wormscore > "$RUNNER_TEMP/app.out" 2>&1 &
          PID=$!
          python packaging/mac_ui_check.py "$RUNNER_TEMP/demo" screenshots || FAILED=1
          kill $PID || true
          cat "$RUNNER_TEMP/app.out"
          exit ${FAILED:-0}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-ui-screenshots
          path: screenshots/
          retention-days: 14
