name: win-app

# Builds the Windows app, builds it again with a higher version number, and installs the second
# over the first through the app's own updater, then goes back (packaging/update_check.py).
# Also repeats both with a file in the app folder held open, which makes the swap fail: the app
# folder must stay whole. No release is involved (the updater reads the "latest release" from a
# local file), and nothing is attached to a release.
on:
  push:
    paths:
      - "src/wormscore/**"
      - "packaging/**"
      - ".github/workflows/win-app.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update-and-go-back:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e .[dev]
      - name: Update, then Go back, with the packaged app
        run: python -X utf8 packaging/update_check.py --work "$env:RUNNER_TEMP\update-check"
      - name: Zip the build that was checked, as the release has it
        # The Windows zip of a release used to be built by hand on one computer. This is the same build
        # the step above installed, updated and went back to, zipped as packaging/build_windows.bat does,
        # with the versions of everything inside it listed. It is kept with the run for 30 days; nothing
        # is published.
        run: |
          python -c "import shutil; shutil.make_archive(r'$env:RUNNER_TEMP\wormscore-windows', 'zip', r'$env:RUNNER_TEMP\update-check\dist1', 'wormscore')"
          python -m pip freeze > "$env:RUNNER_TEMP\wormscore-windows-packages.txt"
          Get-FileHash "$env:RUNNER_TEMP\wormscore-windows.zip" -Algorithm SHA256 | Format-List
      - uses: actions/upload-artifact@v4
        with:
          name: wormscore-windows
          path: |
            ${{ runner.temp }}/wormscore-windows.zip
            ${{ runner.temp }}/wormscore-windows-packages.txt
          retention-days: 30
