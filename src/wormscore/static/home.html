<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>wormscore</title>
<link rel="icon" href="/static/icon-192.png" sizes="192x192" type="image/png">
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/static/icon-192.png">
<link rel="manifest" href="/static/manifest.webmanifest">
<link rel="stylesheet" href="/static/home.css">
</head>
<body>
<header class="top">
  <div class="brand"><img src="/static/icon.svg" alt="" width="22" height="22"><span>wormscore</span><span class="ver" id="ver"></span>
    <button class="upd-pill" id="updPill" hidden title="See what's new and update"></button></div>
  <div class="top-actions">
    <button class="ghost" id="guideBtn" title="Open the guide in your web browser">Guide</button>
    <button class="ghost icon" id="settingsBtn" title="Settings and updates" aria-label="Settings and updates"></button>
    <button class="ghost icon" id="themeBtn" title="Switch light / dark" aria-label="Switch light or dark mode"></button>
  </div>
</header>

<div class="layout">
  <aside class="side">
    <div class="side-head">Projects</div>
    <div id="recent" class="recent"></div>
    <div class="side-actions">
      <button class="btn" data-act="open-project">Open project...</button>
      <button class="btn" data-act="new-project">New project...</button>
      <button class="btn subtle" data-act="demo">Try a demo...</button>
    </div>
  </aside>

  <main id="main" class="main"><p class="loading">Loading...</p></main>
</div>

<div id="modal" class="modal" hidden>
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <h3 id="mTitle"></h3>
    <div id="mBody" class="m-body"></div>
    <div id="mChoices" class="m-choices"></div>
    <div class="m-foot"><button class="btn subtle" id="mCancel">Cancel</button></div>
  </div>
</div>
<div id="updModal" class="modal" hidden>
  <div class="dialog upd-dialog" id="updBox" role="dialog" aria-modal="true" aria-labelledby="udTitle"></div>
</div>
<div id="reconn" class="reconn" role="status" hidden>Reconnecting to wormscore...</div>
<div id="goneModal" class="modal" hidden>
  <div class="dialog" role="alertdialog" aria-modal="true" aria-labelledby="goneTitle">
    <h3 id="goneTitle">wormscore is not running</h3>
    <div class="m-body">It may have been closed, or the computer restarted. Your projects and saved scores are safe.</div>
    <p class="m-body" id="goneHow"></p>
    <div class="m-foot"><button class="primary" id="goneStart" hidden>Start wormscore</button></div>
  </div>
</div>
<div id="toast" class="toast" hidden></div>

<script src="/static/home.js"></script>
</body>
</html>
